<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>媒体查看器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0f1115; color: #e5e7eb;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 24px; gap: 16px;
    }
    h1 { font-size: 16px; font-weight: 600; color: #9ca3af; max-width: 90%;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stage { flex: 1; width: 100%; display: flex; align-items: center;
             justify-content: center; min-height: 0; }
    video, audio { width: 100%; max-height: 100%; outline: none;
                   background: #000; border-radius: 8px; }
    audio { max-width: 640px; }
    img { max-width: 96%; max-height: 96%; object-fit: contain; border-radius: 8px; }
    .card {
      background: #1c212b; border: 1px solid #2c3340; border-radius: 12px;
      padding: 28px 36px; text-align: center; max-width: 560px; line-height: 1.9;
    }
    .card .warn { color: #fbbf24; font-size: 15px; }
    .card .hint { color: #9ca3af; font-size: 13px; }
    .url { max-width: 92%; color: #6b7280; font-size: 12px; word-break: break-all;
           text-align: center; }
    .actions { display: flex; gap: 12px; justify-content: center; }
    button {
      background: #2563eb; color: #fff; border: none; border-radius: 8px;
      padding: 9px 20px; font-size: 14px; cursor: pointer;
    }
    button.ghost { background: #1f2937; color: #e5e7eb; }
    button:hover { opacity: .88; }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="stage" id="stage"></div>
  <div class="actions" id="ctrlBar" style="display:none;">
    <button class="ghost" id="speedBtn" title="循环切换播放倍速">倍速 1×</button>
    <button class="ghost" id="pipBtn" title="画中画（小窗悬浮播放）">画中画</button>
    <button class="ghost" id="shotBtn" title="截取当前画面（跨域视频可能因版权保护而失败）">截图</button>
  </div>
  <div class="url" id="url"></div>
  <script src="js/viewer.js"></script>
</body>
</html>
